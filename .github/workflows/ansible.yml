name: Ansible CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: python3 -m pip install ansible-core

      - name: Validate Ansible Playbook
        run: |
          ansible-playbook -i inventory \
            install_httpd.yml --syntax-check

      - name: Display Target Servers
        run: |
          ansible-playbook -i inventory \
            install_httpd.yml --list-hosts
